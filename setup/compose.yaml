# Front Bee SM — build depuis la racine du repo (package.json parent).
# Variables lues depuis setup/.env (env_file + interpolation ${…}).
#
# Usage (depuis setup/) :
#   docker compose up --build
# Conteneur : bee-sm-front (port 3000)

name: bee-sm-front

services:
  bee-sm-front:
    container_name: bee-sm-front
    build:
      context: ..
      dockerfile: setup/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://host.docker.internal:8090}
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://host.docker.internal:8090}
    ports:
      - "3000:3000"
