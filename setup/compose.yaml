# Front SMELS — build depuis la racine du repo (package.json parent).
services:
  server:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://host.docker.internal:8090}
    ports:
      - 3000:3000
